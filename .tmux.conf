# =========================================
# PREFIX
# =========================================

set -g prefix C-a
unbind C-b
bind C-a send-prefix

# =========================================
# GENERAL BEHAVIOR
# =========================================

set -g allow-passthrough on
set -g history-limit 50000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -s escape-time 0

set -g status-keys vi
setw -g mode-keys vi

set -g mouse on
set -g focus-events on
set -g aggressive-resize on

# faster pane switching
set -g repeat-time 300

# use system clipboard when possible
set -s set-clipboard on

# prevent accidental pane exit
set -g detach-on-destroy off

# =========================================
# TRUECOLOR / TERMINAL
# =========================================

set -g default-terminal "tmux-256color"

set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",kitty:RGB"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",wezterm:RGB"

# forward terminal info through ssh
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# =========================================
# STATUS BAR
# =========================================

set -g status-position top
set -g status-justify left

set -g status-left-length 40
set -g status-right-length 100

# palette
# amber:     #f59e0b
# soft:      #f6c177
# dark:      #14181d
# panel:     #191726
# muted:     #6e6a86

set -g status-style "bg=default,fg=#6e6a86"

set -g pane-border-style "fg=#14181d"
set -g pane-active-border-style "fg=#f59e0b"

set -g mode-style "bg=#191726,fg=#f59e0b"

set -g message-style "bg=#191726,fg=#f6c177,bold"
set -g message-command-style "bg=#f6c177,fg=#14181d,bold"

setw -g window-status-separator ""

setw -g window-status-style \
    "fg=#f6c177,bg=default"

setw -g window-status-format \
    "#[fg=#6e6a86] #I #W #F"

setw -g window-status-current-format \
    "#[fg=#14181d,bg=#f59e0b,bold] #I:#W #[default]"

set -g status-left \
    '#[fg=#14181d,bg=#f59e0b,bold] #S #[fg=#f59e0b,bg=default]'

# =========================================
# STATUS RIGHT
# =========================================

set -g status-interval 5

if-shell 'test "$(uname -s)" = "Linux"' {
    set -g status-right '#[fg=green]Mem: #(awk "/MemTotal|MemFree/ {printf \"%.0fM \", \$2/1024}" /proc/meminfo) #[fg=default] #(cut -d " " -f1-3 /proc/loadavg) #[fg=#f59e0b]#[fg=#14181d,bg=#f59e0b,bold] %b %d %H:%M '
}

if-shell 'test "$(uname -s)" = "FreeBSD"' {
    set -g status-right '#(/usr/local/bin/tmux-mem-cpu-load -g 0 --interval 2 --colors) #[fg=#f59e0b]#[fg=#14181d,bg=#f59e0b,bold] %Y-%m-%d %H:%M '
}

# =========================================
# SPLITS
# =========================================

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# old aliases
bind v split-window -v -c "#{pane_current_path}"
bind b split-window -h -c "#{pane_current_path}"

# =========================================
# PANE NAVIGATION
# =========================================

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =========================================
# WINDOW NAVIGATION
# =========================================

unbind n
unbind p

bind -r C-h previous-window
bind -r C-l next-window

# alt-arrow without prefix
bind -n M-Left  previous-window
bind -n M-Right next-window

# =========================================
# SESSION NAVIGATION
# =========================================

# shift-left / shift-right
bind -n S-Left  switch-client -p
bind -n S-Right switch-client -n

# alternate:
# bind -n M-S-Left  switch-client -p
# bind -n M-S-Right switch-client -n

# =========================================
# COPY MODE
# =========================================

bind Enter copy-mode

# vi copy behavior
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# =========================================
# UTILITIES
# =========================================

bind x kill-pane

bind r source-file ~/.tmux.conf \; \
    display-message "tmux.conf reloaded"

# synchronize panes toggle
bind y setw synchronize-panes

# popup session chooser
bind-key C-f display-popup -E "tmux list-sessions"

# easier window renaming
bind-key R command-prompt "rename-window '%%'"
